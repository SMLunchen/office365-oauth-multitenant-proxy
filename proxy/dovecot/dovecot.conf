# Minimal Dovecot config — SASL backend only, no mail delivery
protocols =
disable_plaintext_auth = no
auth_mechanisms = plain login

# Credentials from a simple plaintext file generated by configure.py
# Format: username:{PLAIN}password
passdb {
  driver = passwd-file
  args = scheme=PLAIN /etc/dovecot/users
}

userdb {
  driver = static
  args = uid=65534 gid=65534
}

# Expose auth socket into Postfix spool directory
service auth {
  unix_listener /var/spool/postfix/private/auth {
    mode = 0660
    user = postfix
    group = postfix
  }
  user = $default_internal_user
}

# Suppress verbose startup noise
log_path = /dev/stderr
info_log_path = /dev/null
