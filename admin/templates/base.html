<!doctype html>
<html lang="de" data-bs-theme="dark">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>{% block title %}SMTP OAuth Proxy{% endblock %} — Admin</title>
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css">
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css">
  <link rel="stylesheet" href="/static/css/main.css">
</head>
<body>

{% if user is defined and user %}
<div class="d-flex vh-100">
  <!-- Sidebar -->
  <nav class="sidebar d-flex flex-column flex-shrink-0 p-3">
    <a href="/" class="d-flex align-items-center mb-4 text-white text-decoration-none">
      <i class="bi bi-envelope-at fs-4 me-2 text-primary"></i>
      <span class="fs-6 fw-semibold">SMTP OAuth Proxy</span>
    </a>
    <hr class="text-secondary">
    <ul class="nav nav-pills flex-column mb-auto">
      <li class="nav-item">
        <a href="/" class="nav-link text-white {% if request.url.path == '/' %}active{% endif %}">
          <i class="bi bi-speedometer2 me-2"></i>Dashboard
        </a>
      </li>
      <li>
        <a href="/tenants" class="nav-link text-white {% if '/tenants' in request.url.path %}active{% endif %}">
          <i class="bi bi-people me-2"></i>Tenants
        </a>
      </li>
      <li>
        <a href="/logs" class="nav-link text-white {% if request.url.path == '/logs' %}active{% endif %}">
          <i class="bi bi-journal-text me-2"></i>Mail-Logs
        </a>
      </li>
      <li>
        <a href="/security" class="nav-link text-white {% if request.url.path == '/security' %}active{% endif %}">
          <i class="bi bi-shield-lock me-2"></i>Sicherheit
        </a>
      </li>
    </ul>
    <hr class="text-secondary">
    <div class="d-flex align-items-center gap-2">
      <i class="bi bi-person-circle fs-5 text-secondary"></i>
      <small class="text-secondary flex-grow-1">{{ user.username }}</small>
      <a href="/logout" class="btn btn-sm btn-outline-secondary" title="Abmelden">
        <i class="bi bi-box-arrow-right"></i>
      </a>
    </div>
  </nav>

  <!-- Main -->
  <main class="flex-grow-1 overflow-auto p-4">
    {% block content %}{% endblock %}
  </main>
</div>
{% else %}
  {% block auth_content %}{% endblock %}
{% endif %}

<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
{% block scripts %}{% endblock %}
</body>
</html>
